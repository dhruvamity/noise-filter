[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeclock"
version = "1.0.0"
description = "IST Trade-Window Quant Research Pipeline and Live Terminal for BTC and Gold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
